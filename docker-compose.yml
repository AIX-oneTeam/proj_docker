version: '3.8'

services:
  backend:
    build:
      context: .  # 프로젝트 루트를 빌드 컨텍스트로 설정
      dockerfile: ./backend/Dockerfile  # Dockerfile 경로 지정
    ports:
      - "5000:5000"
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: test_db
    ports:
      - "3306:3306"

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html
    ports:
      - "8080:80"
