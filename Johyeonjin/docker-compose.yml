networks:
  app_network:
    driver: bridge

services:
  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    networks:
      - app_network
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
      MYSQL_USER: fastapi
      MYSQL_PASSWORD: fastapi
    volumes:
      - mysql_data:/var/lib/mysql
    command: --bind-address=0.0.0.0 --default-authentication-plugin=mysql_native_password

  fastapi:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - app_network
    depends_on:
      - db
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./app:/app

volumes:
  mysql_data:
