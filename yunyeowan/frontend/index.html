<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <script>
        async function fetchCounter() {
            const response = await fetch('http://localhost:8000/counter');
            const data = await response.json();
            document.getElementById('counter').innerText = data.value;
        }

        async function updateCounter(action) {
            await fetch('http://localhost:8000/counter', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ action })
            });
            fetchCounter();
        }

        window.onload = fetchCounter;
    </script>
</head>
<body>
    <h1>Counter App</h1>
    <p>Value: <span id="counter">0</span></p>
    <button onclick="updateCounter('increment')">Increase</button>
    <button onclick="updateCounter('decrement')">Decrease</button>
</body>
</html>
